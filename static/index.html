<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유튜브 스크립트 번역 보고서 AI</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1f2933;
    --muted: #6b7280;
    --accent: #b8543a;
    --accent-dark: #97432e;
    --border: #e2ddd2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }
  header h1 { font-size: 1.7rem; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0 0 28px; }
  form {
    display: flex; gap: 10px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px;
  }
  input[type="url"] {
    flex: 1 1 320px; padding: 12px 14px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  input[type="url"]:focus { border-color: var(--accent); }
  select {
    padding: 12px 10px; font-size: 0.95rem;
    border: 1px solid var(--border); border-radius: 10px; background: #fff;
  }
  button {
    padding: 12px 22px; font-size: 1rem; font-weight: 600;
    color: #fff; background: var(--accent); border: none;
    border-radius: 10px; cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { background: #c9c2b6; cursor: not-allowed; }
  .status { margin: 18px 4px; color: var(--muted); font-size: 0.92rem; min-height: 1.4em; }
  .status.error { color: #b3261e; }
  .spinner {
    display: inline-block; width: 12px; height: 12px; margin-right: 8px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #report {
    display: none;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 30px 34px; margin-top: 6px;
    overflow-wrap: break-word;
  }
  #report h1 { font-size: 1.45rem; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
  #report h2 { font-size: 1.18rem; margin-top: 1.8em; color: var(--accent-dark); }
  #report h3 { font-size: 1.04rem; margin-top: 1.4em; }
  #report blockquote {
    margin: 0.8em 0; padding: 8px 16px; color: #4b5563;
    border-left: 3px solid var(--accent); background: #faf7f1;
  }
  #report table { border-collapse: collapse; width: 100%; margin: 0.8em 0; font-size: 0.94rem; }
  #report th, #report td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; }
  #report th { background: #f3efe6; }
  #report code { background: #f3efe6; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  .toolbar { display: none; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .toolbar button { background: #fff; color: var(--ink); border: 1px solid var(--border); font-weight: 500; padding: 8px 16px; font-size: 0.9rem; }
  .toolbar button:hover { background: #f3efe6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 유튜브 스크립트 번역 보고서 AI</h1>
    <p>유튜브 링크를 붙여넣으면 영상 스크립트를 번역하여 보고서 형식으로 정리해 드립니다.</p>
  </header>

  <form id="form">
    <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." required>
    <select id="lang">
      <option value="한국어" selected>한국어</option>
      <option value="English">English</option>
      <option value="日本語">日本語</option>
      <option value="中文(简体)">中文(简体)</option>
      <option value="Español">Español</option>
    </select>
    <button type="submit" id="submit">보고서 생성</button>
  </form>

  <div class="status" id="status"></div>
  <article id="report"></article>
  <div class="toolbar" id="toolbar">
    <button type="button" id="copy">📋 마크다운 복사</button>
    <button type="button" id="download">⬇️ 파일로 저장</button>
  </div>
</div>

<script>
const form = document.getElementById("form");
const urlInput = document.getElementById("url");
const langSelect = document.getElementById("lang");
const submitBtn = document.getElementById("submit");
const statusEl = document.getElementById("status");
const reportEl = document.getElementById("report");
const toolbar = document.getElementById("toolbar");

let rawMarkdown = "";

// 외부 라이브러리 없이 동작하는 최소 마크다운 렌더러
function renderMarkdown(md) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");

  const lines = md.split("\n");
  let html = "", listOpen = false, tableRows = [];

  const closeList = () => { if (listOpen) { html += "</ul>"; listOpen = false; } };
  const flushTable = () => {
    if (!tableRows.length) return;
    const [head, ...body] = tableRows;
    html += "<table><thead><tr>" + head.map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
    for (const row of body) html += "<tr>" + row.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
    html += "</tbody></table>";
    tableRows = [];
  };

  for (const line of lines) {
    const t = line.trim();
    if (/^\|.*\|$/.test(t)) {
      const cells = t.slice(1, -1).split("|").map(c => c.trim());
      if (!cells.every(c => /^:?-{2,}:?$/.test(c))) tableRows.push(cells);
      continue;
    }
    flushTable();
    if (t.startsWith("### ")) { closeList(); html += `<h3>${inline(t.slice(4))}</h3>`; }
    else if (t.startsWith("## ")) { closeList(); html += `<h2>${inline(t.slice(3))}</h2>`; }
    else if (t.startsWith("# "))  { closeList(); html += `<h1>${inline(t.slice(2))}</h1>`; }
    else if (t.startsWith("> "))  { closeList(); html += `<blockquote>${inline(t.slice(2))}</blockquote>`; }
    else if (/^[-*] /.test(t))    { if (!listOpen) { html += "<ul>"; listOpen = true; } html += `<li>${inline(t.slice(2))}</li>`; }
    else if (t === "")            { closeList(); }
    else                          { closeList(); html += `<p>${inline(t)}</p>`; }
  }
  closeList();
  flushTable();
  return html;
}

function setStatus(msg, isError = false, busy = false) {
  statusEl.className = "status" + (isError ? " error" : "");
  statusEl.innerHTML = (busy ? '<span class="spinner"></span>' : "") + msg;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  rawMarkdown = "";
  reportEl.style.display = "none";
  reportEl.innerHTML = "";
  toolbar.style.display = "none";
  setStatus("스크립트를 가져오는 중...", false, true);

  try {
    const resp = await fetch("/api/report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: urlInput.value, target_language: langSelect.value }),
    });
    if (!resp.ok || !resp.body) throw new Error("서버 오류가 발생했습니다.");

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const block = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        const eventMatch = block.match(/^event: (.+)$/m);
        const dataMatch = block.match(/^data: (.+)$/m);
        if (!eventMatch || !dataMatch) continue;
        const event = eventMatch[1];
        const data = JSON.parse(dataMatch[1]);

        if (event === "meta") {
          const gen = data.is_generated ? " · 자동 생성 자막" : "";
          setStatus(`자막 확인 완료 (${data.source_language}${gen}) — 보고서 작성 중...`, false, true);
          reportEl.style.display = "block";
        } else if (event === "delta") {
          rawMarkdown += data.text;
          reportEl.innerHTML = renderMarkdown(rawMarkdown);
        } else if (event === "error") {
          setStatus(data.message, true);
          submitBtn.disabled = false;
          return;
        } else if (event === "done") {
          setStatus("✅ 보고서 작성 완료");
          toolbar.style.display = "flex";
        }
      }
    }
  } catch (err) {
    setStatus(err.message || "오류가 발생했습니다.", true);
  } finally {
    submitBtn.disabled = false;
  }
});

document.getElementById("copy").addEventListener("click", async () => {
  await navigator.clipboard.writeText(rawMarkdown);
  setStatus("📋 마크다운이 클립보드에 복사되었습니다.");
});

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([rawMarkdown], { type: "text/markdown;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "youtube-report.md";
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
